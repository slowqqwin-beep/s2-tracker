name: S2 Tracker Pipeline

on:
  # 定时触发: 每周一/三/五 北京时间早上 9 点 (UTC 01:00)
  # 财报季高峰期手动触发更灵活
  schedule:
    - cron: '0 1 * * 1,3,5'

  # 手动触发: 在 GitHub Actions 页面点 Run workflow 按钮
  workflow_dispatch:
    inputs:
      ticker:
        description: '只跑单只股票 (留空=跑全部)'
        required: false
        default: ''
      period:
        description: '财报期, 例如 Q1 2026'
        required: false
        default: 'Q1 2026'
      smart:
        description: '使用 Opus 模型 (true/false)'
        required: false
        default: 'false'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 commit JSON 回仓库

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 构造命令行参数
          ARGS=""
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            ARGS="$ARGS --ticker ${{ github.event.inputs.ticker }}"
          fi
          if [ -n "${{ github.event.inputs.period }}" ]; then
            ARGS="$ARGS --period \"${{ github.event.inputs.period }}\""
          fi
          if [ "${{ github.event.inputs.smart }}" = "true" ]; then
            ARGS="$ARGS --smart"
          fi

          # 没有 transcript 文件时, 跑 demo 兜底 (不消耗 API)
          if [ -z "$(ls -A data/transcripts 2>/dev/null)" ]; then
            echo "⚠️ data/transcripts 为空, 跑 demo 模式"
            python -m src.demo
          else
            eval python -m src.pipeline $ARGS
          fi

      - name: Commit JSON output
        run: |
          git config user.name  "s2-tracker-bot"
          git config user.email "actions@github.com"
          git add data/processed/dashboard_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 auto-update dashboard_data.json [$(date +'%Y-%m-%d %H:%M')]"
            git push
          fi
