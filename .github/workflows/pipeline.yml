name: S2 Tracker Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install openai pandas requests

      - name: Run Analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: 
          # 1. 第一步：打印当前目录内容（万一报错，我们可以看到底有没有 src）
          ls -R
          
          # 2. 第二步：设置 Python 查找路径（注意，这是单独的一行）
          export PYTHONPATH=$PYTHONPATH:.
          
          # 3. 第三步：运行代码
          python -m src.pipeline --ticker PLTR --period "Q4 2025"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.json
          git commit -m "Auto-update dashboard data [skip ci]" || exit 0
          git push
